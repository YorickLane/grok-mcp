[project]
name = "grok-mcp"
version = "0.5.1"
description = "Lean MCP server for xAI Grok — full Live Search capability surface, modular architecture, explicit roadmap"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Yorick Lane"}]
keywords = ["mcp", "grok", "xai", "live-search", "claude-code", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # Capped at the tested minor: tool exception text masking arrived in minor
    # 2.1 (python-sdk PR #3314). Bump the cap only after re-checking behavior.
    "mcp>=2.2,<2.3",
    "httpx[socks]>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.16,<0.17"]

[project.scripts]
grok-mcp = "grok.server:main"

[project.urls]
Homepage = "https://github.com/YorickLane/grok-mcp"
Issues = "https://github.com/YorickLane/grok-mcp/issues"
Changelog = "https://github.com/YorickLane/grok-mcp/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grok"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
